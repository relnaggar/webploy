services:
  litestream:
    image: litestream/litestream:0.5.8
    volumes:
      - db:/var/db
      - ./litestream.yml:/etc/litestream.yml:ro
    command: replicate
    environment:
      - LITESTREAM_R2_ACCOUNT_ID=${LITESTREAM_R2_ACCOUNT_ID}
      - LITESTREAM_R2_BUCKET=${LITESTREAM_R2_BUCKET}
      - LITESTREAM_ACCESS_KEY_ID=${LITESTREAM_ACCESS_KEY_ID}
      - LITESTREAM_SECRET_ACCESS_KEY=${LITESTREAM_SECRET_ACCESS_KEY}
    deploy:
      replicas: 1
      restart_policy:
        condition: any
